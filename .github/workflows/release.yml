name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish a release for (e.g. v1.0.7)'
        required: true
      ref:
        description: 'Commit-ish to release, used to create the tag when it does not exist yet'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag='${{ inputs.tag }}'
            # The tag may not exist yet; release from the requested
            # commit-ish and let the publish step create the tag there.
            ref='${{ inputs.ref }}'
          else
            tag="${GITHUB_REF#refs/tags/}"
            ref="$tag"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}
          # Full history and tags so the notes can span every version
          # released since the previous tag.
          fetch-depth: 0

      - name: Run tests
        # Node 22 treats --test arguments as globs, so a bare directory
        # resolves as a module path and fails before any test runs.
        run: node --test "tests/**/*.test.mjs"

      - name: Verify packaged artifacts match the tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail

          declared=$(sed -n 's|^// @version  *||p' wckbot-baidu-pan-quicklink.user.js)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::@version is $declared but the tag says $VERSION"
            exit 1
          fi

          if ! diff -q wckbot-baidu-pan-quicklink.user.js \
                      dist/wckbot-baidu-pan-quicklink.user.js; then
            echo "::error::dist/ script is out of sync with the repository root"
            exit 1
          fi

          # The zip is the @downloadURL target's companion; a stale one would
          # ship an older script to anyone downloading the release.
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Build release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail

          # Cover every changelog entry back to the previously tagged
          # release, so versions that were bumped without being tagged
          # still appear somewhere. Excluding the tag being released
          # gives the same answer whether or not it exists yet.
          previous=$(git describe --tags --abbrev=0 --exclude "$TAG" HEAD 2>/dev/null || echo '')
          echo "Previous release tag: ${previous:-none}"

          {
            awk -v start="## [$VERSION]" -v stop="## [${previous#v}]" '
              index($0, start) == 1 { found = 1; print; next }
              found && stop != "## []" && index($0, stop) == 1 { exit }
              found { print }
            ' CHANGELOG.md

            echo '### Install'
            echo
            echo 'Install the attached `wckbot-baidu-pan-quicklink.user.js`, or use the'
            echo '[raw userscript](https://raw.githubusercontent.com/jitdor/userscript-wckbot/main/wckbot-baidu-pan-quicklink.user.js).'
            echo
            echo '### SHA-256'
            echo
            echo '```text'
            cat dist/SHA256SUMS
            echo '```'
          } > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail

          # --target only applies when the tag does not exist yet, in
          # which case it is created at the commit that was verified
          # above rather than at whatever the default branch now points to.
          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "Wckbot Baidu Pan QuickLink $TAG" \
            --notes-file release-notes.md \
            "dist/wckbot-baidu-pan-quicklink.user.js" \
            "dist/wckbot-baidu-pan-quicklink-v${VERSION}.zip"
